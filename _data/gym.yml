# =============================================================
# GYM progress tracker  ->  /gym/
# Rituals:
#   1. Progressed on a lift? Bump its `kg` in `workouts` below.
#      That board is your running record of current working weights.
#   2. After a session: append a line to `log` with the date, which
#      day you trained, hours slept the night before, and bodyweight.
#      Put any weight change or PR in `lifts` (free text).
# The page shows sessions logged, average sleep, and highlights
# today's split day for you.
#
# Split is Upper A / Upper B. The two seeded workouts came from your
# Notion tables that had real weights (Anterior -> A, Upper -> B).
# Rename days or swap exercises freely; the page just renders this.
# =============================================================

title: "GYM — progress"

split:
  - { day: "Monday",    dow: 1, focus: "Rest" }
  - { day: "Tuesday",   dow: 2, focus: "Upper A" }
  - { day: "Wednesday", dow: 3, focus: "Upper B" }
  - { day: "Thursday",  dow: 4, focus: "Rest" }
  - { day: "Friday",    dow: 5, focus: "Upper A" }
  - { day: "Saturday",  dow: 6, focus: "Upper B" }
  - { day: "Sunday",    dow: 0, focus: "Rest" }

# Current working weights. Bump `kg` when you hit a new top set.
workouts:
  - name: "Upper A"
    exercises:
      - { name: "Upper Back Row",   sets: 2, reps: "", kg: "" }
      - { name: "Chest Fly",        sets: 2, reps: "", kg: "" }
      - { name: "Lat Pulldown",     sets: 2, reps: "", kg: "" }
      - { name: "Upper Chest Press", sets: 2, reps: "", kg: "" }
  - name: "Upper B"
    exercises:
      - { name: "Uni Tricep Extension", sets: 2, reps: "6-5", kg: "26.5" }
      - { name: "Lateral Raise",        sets: 2, reps: "7-6", kg: "32.5" }
      - { name: "Recline Curl",         sets: 2, reps: "6-5", kg: "17.5" }
      - { name: "Shoulder Press",       sets: 2, reps: "",    kg: "" }
      - { name: "Reverse Curl",         sets: 2, reps: "",    kg: "" }

# Session log. sleep = hours slept the night before, bw = bodyweight (kg).
# Copy the last line each session.
log:
  - { date: 2026-07-30, day: "Upper A", sleep: , bw: , lifts: "" }
