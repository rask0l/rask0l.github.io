---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.categories.size > 0 %} · {{ page.categories | join: ", " | downcase }}{% endif %}
  </p>

  {{ content }}

  {% if page.tags.size > 0 %}
  <p class="tags">
    {% for tag in page.tags %}<span class="tag">#{{ tag }}</span> {% endfor %}
  </p>
  {% endif %}
</article>
